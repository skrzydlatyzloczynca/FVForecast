<meta name="theme-color" content="#B5760A">
<style>
  :root {
    --bg: #FAF7F2;
    --text: #22201C;
    --muted: #6B6558;
    --accent: #B5760A;
    --slate: #57687A;
    --divider: #E4DFD3;
    --danger: #A6432E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  .wrap { max-width: 460px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }

  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .icon-btn {
    background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--muted); padding: 4px 8px;
  }

  .day-row { padding: 18px 0; border-bottom: 1px solid var(--divider); }
  .day-row:first-of-type { border-top: 1px solid var(--divider); }

  .day-header { display: flex; align-items: baseline; justify-content: space-between; }

  .day-label { font-size: 0.95rem; color: var(--muted); }

  .day-value {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    font-size: 1.5rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .value-good { color: var(--accent); }
  .value-mid { color: var(--slate); }
  .value-low { color: var(--danger); }

  .day-metrics { display: flex; align-items: baseline; gap: 10px; }

  .day-pct {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    font-size: 1rem; font-weight: 600;
  }

  .day-chart { margin-top: 10px; }
  .day-chart svg { display: block; }

  .legend {
    display: flex; gap: 18px; margin-bottom: 4px;
    font-size: 0.78rem; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 0; border-top: 2.5px solid; display: inline-block; }
  .legend .swatch.max { border-top-style: dashed; border-color: var(--slate); }
  .legend .swatch.actual { border-color: var(--accent); }

  .status { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
  .status.error { color: var(--danger); }

  #settings { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--divider); display: none; }
  #settings.open { display: block; }

  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 4px; }
  .hint { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

  input {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--divider); border-radius: 4px;
    background: #fff; color: var(--text); font-family: inherit;
  }

  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  .spinner { display: flex; align-items: center; gap: 6px; }
  .spinner input { text-align: center; }
  .spin-btn {
    flex-shrink: 0; width: 38px; height: 38px;
    border: 1px solid var(--divider); border-radius: 4px;
    background: #fff; color: var(--text); font-size: 1.2rem;
    line-height: 1; cursor: pointer;
  }
  .spin-btn:active { background: var(--divider); }

  button.primary {
    margin-top: 20px; width: 100%; padding: 12px; font-size: 1rem;
    background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }

  .refresh-link {
    display: inline-block; margin-top: 24px; font-size: 0.85rem; color: var(--muted);
    text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Prognoza FV</h1>
    <button class="icon-btn" id="toggleSettings" aria-label="Ustawienia">⚙</button>
  </header>

  <div class="legend">
    <span><span class="swatch max"></span>maksimum (bez chmur)</span>
    <span><span class="swatch actual"></span>prognoza</span>
  </div>

  <div id="results">
    <div class="day-row">
      <div class="day-header">
        <span class="day-label">Dziś</span>
        <div class="day-metrics"><span class="day-value" id="val-0">–</span><span class="day-pct" id="pct-0"></span></div>
      </div>
      <div class="day-chart" id="chart-0"></div>
    </div>
    <div class="day-row">
      <div class="day-header">
        <span class="day-label">Jutro</span>
        <div class="day-metrics"><span class="day-value" id="val-1">–</span><span class="day-pct" id="pct-1"></span></div>
      </div>
      <div class="day-chart" id="chart-1"></div>
    </div>
    <div class="day-row">
      <div class="day-header">
        <span class="day-label">Pojutrze</span>
        <div class="day-metrics"><span class="day-value" id="val-2">–</span><span class="day-pct" id="pct-2"></span></div>
      </div>
      <div class="day-chart" id="chart-2"></div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <button class="refresh-link" id="refreshBtn">Odśwież prognozę</button>

  <div id="settings">
    <label for="coords">Współrzędne paneli (lat, lon — wklej z Google Maps)</label>
    <input type="text" id="coords" placeholder="np. 52.1094, 19.4180">

    <div class="field-row">
      <div>
        <label for="tilt">Kąt nachylenia (°)</label>
        <input type="number" id="tilt" min="0" max="90" value="35">
        <div class="hint">0° = płasko, 90° = pionowo</div>
      </div>
      <div>
        <label for="azimuth">Azymut (°)</label>
        <div class="spinner">
          <button type="button" class="spin-btn" id="azimuthDown" aria-label="Zmniejsz azymut">−</button>
          <input type="number" id="azimuth" min="-180" max="180" value="0" step="5">
          <button type="button" class="spin-btn" id="azimuthUp" aria-label="Zwiększ azymut">+</button>
        </div>
        <div class="hint">konwencja Open-Meteo: 0°=płd, -90°=wsch, 90°=zach, ±180°=płn</div>
      </div>
    </div>

    <label for="kwp">Moc instalacji (kWp)</label>
    <input type="number" id="kwp" min="0" step="0.1" value="8">

    <button class="primary" id="saveSettings">Zapisz i pobierz prognozę</button>
  </div>
</div>

<script>
/* =========================================================================
   WZÓR SZACOWANIA PRODUKCJI — WERSJA 3 (GTI z Open-Meteo + własna pozycja Słońca)
   -------------------------------------------------------------------------
   Rzeczywistą produkcję (z uwzględnieniem chmur) liczy Open-Meteo za nas
   (GTI = pełna transpozycja promieniowania na nasz kąt/azymut).
   Ale punkt odniesienia "ile by to było przy czystym niebie" musimy teraz
   policzyć SAMI, dla WŁASNEJ geometrii paneli - bo terrestrial_radiation
   z Open-Meteo jest liczone dla płaszczyzny POZIOMEJ, więc przy niskim
   słońcu (jesień/zima, godziny brzegowe) systematycznie zaniża to, ile
   nachylony panel realnie mógłby złapać (straty kosinusowe płaszczyzny
   poziomej, których nachylony panel unika).
   Dlatego liczymy własną, uproszczoną astronomię: pozycję Słońca (wysokość,
   azymut) dla danej godziny i lokalizacji, kąt padania na NASZ panel,
   i z tego teoretyczne promieniowanie poza atmosferą na naszej płaszczyźnie.
   Jedna zahardkodowana stała (ATMOSPHERIC_CLEAR_SKY_FACTOR) doszacowuje
   tylko to, ile z tego przebija czysta atmosfera - to jedyne uproszczenie,
   jakie zostaje (reszta to ścisła geometria).
   ========================================================================= */

// Współczynnik strat systemowych (Performance Ratio) — typowe realne instalacje
// tracą 15-25% względem mocy "papierowej" (falownik, okablowanie, temperatura,
// zabrudzenie paneli). Wartość do skorygowania, gdy porównasz z prawdziwym licznikiem.
const PERFORMANCE_RATIO = 0.80;

// Jaka część promieniowania teoretycznego (policzonego przez NAS dla naszej
// geometrii, poza atmosferą) realnie dociera do ziemi w PRAWDZIWIE bezchmurny
// dzień. To już tylko przybliżenie ATMOSFERY (rozpraszanie, pochłanianie przez
// powietrze, parę wodną itd.) - geometria (nachylenie, azymut, pozycja słońca)
// jest policzona ściśle, więc ta jedna stała ma teraz dużo węższe zadanie
// niż poprzednio. Typowa wartość dla czystego nieba to ok. 0.7-0.8.
const ATMOSPHERIC_CLEAR_SKY_FACTOR = 0.75;

function degToRad(deg) { return deg * Math.PI / 180; }
function radToDeg(rad) { return rad * 180 / Math.PI; }

// Dzień roku (1-366) z daty lokalnej - zwykła arytmetyka kalendarzowa,
// bez używania obiektu Date (żeby uniknąć niuansów stref czasowych/DST).
function dayOfYear(year, month, day) {
  const cumDays = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let doy = cumDays[month - 1] + day;
  const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  if (isLeap && month > 2) doy += 1;
  return doy;
}

// Deklinacja Słońca (kąt między promieniami słonecznymi a płaszczyzną
// równika) - wzór Coopera, standardowe przybliżenie inżynierskie.
function solarDeclinationDeg(doy) {
  return 23.45 * Math.sin(degToRad((360 / 365) * (284 + doy)));
}

// "Równanie czasu" - niewielka (do ok. ±16 min) poprawka wynikająca z tego,
// że orbita Ziemi nie jest idealnym okręgiem, a oś nie jest prostopadła
// do orbity. Standardowe przybliżenie.
function equationOfTimeMinutes(doy) {
  const b = degToRad((360 / 365) * (doy - 81));
  return 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
}

// Pozycja Słońca (wysokość i azymut, w konwencji Open-Meteo: 0°=południe,
// -90°=wschód, 90°=zachód) dla danej lokalizacji, dnia roku i godziny
// zegarowej (czas cywilny, stąd korekta o Twoją strefę czasową i długość
// geograficzną - "czas słoneczny" różni się od czasu na zegarku).
function solarPosition(lat, lon, utcOffsetHours, doy, decimalHour) {
  const standardMeridian = utcOffsetHours * 15; // południk odniesienia dla Twojej strefy
  const eot = equationOfTimeMinutes(doy);
  const solarTime = decimalHour + (4 * (lon - standardMeridian) + eot) / 60;
  const hourAngle = 15 * (solarTime - 12); // stopnie; ujemny rano, dodatni po południu

  const decl = solarDeclinationDeg(doy);
  const latR = degToRad(lat), declR = degToRad(decl), haR = degToRad(hourAngle);

  const sinElev = Math.sin(latR) * Math.sin(declR) + Math.cos(latR) * Math.cos(declR) * Math.cos(haR);
  const elevR = Math.asin(Math.max(-1, Math.min(1, sinElev)));
  const elevationDeg = radToDeg(elevR);

  // UWAGA: kolejność w liczniku ma znaczenie - to sin(wysokość)*sin(lat) - sin(deklinacji),
  // nie odwrotnie (odwrotna kolejność daje wynik przesunięty o 180°, czyli "północ"
  // zamiast "południe" w środku dnia - dokładnie taki błąd tu wcześniej był).
  let cosAz = (Math.sin(elevR) * Math.sin(latR) - Math.sin(declR)) / (Math.cos(elevR) * Math.cos(latR));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  const azMagnitude = radToDeg(Math.acos(cosAz)); // 0..180, bez znaku
  const azimuthDeg = hourAngle < 0 ? -azMagnitude : azMagnitude; // rano ujemny (wschód), po południu dodatni (zachód)

  return { elevationDeg, azimuthDeg };
}

// Kosinus kąta padania promieni słonecznych na NASZ panel (kąt między
// wektorem na Słońce a normalną do panelu) - standardowy wzór transpozycji
// na dowolnie nachyloną i zorientowaną płaszczyznę.
function cosIncidenceAngle(elevationDeg, sunAzimuthDeg, tilt, panelAzimuth) {
  const elevR = degToRad(elevationDeg);
  const tiltR = degToRad(tilt);
  const azDiffR = degToRad(sunAzimuthDeg - panelAzimuth);
  return Math.cos(elevR) * Math.sin(tiltR) * Math.cos(azDiffR) + Math.sin(elevR) * Math.cos(tiltR);
}

// Teoretyczne promieniowanie (poza atmosferą, W/m²) padające na NASZ panel,
// przy założeniu, że Słońce świeci wprost (brak jakiejkolwiek atmosfery,
// nie mówiąc już o chmurach). To "surowy" fizyczny sufit - ATMOSPHERIC_CLEAR_SKY_FACTOR
// doszacowuje dopiero, ile z tego realnie przebija czyste powietrze.
function maxTiltedIrradiance(doy, lat, lon, utcOffsetHours, decimalHour, tilt, panelAzimuth) {
  const { elevationDeg, azimuthDeg } = solarPosition(lat, lon, utcOffsetHours, doy, decimalHour);
  if (elevationDeg <= 0) return 0; // Słońce pod horyzontem

  const cosBeta = cosIncidenceAngle(elevationDeg, azimuthDeg, tilt, panelAzimuth);
  if (cosBeta <= 0) return 0; // Słońce świeci "zza pleców" panelu

  // Stała słoneczna skorygowana o zmienną w ciągu roku odległość Ziemia-Słońce
  const eccentricityCorr = 1 + 0.033 * Math.cos(degToRad(360 * doy / 365));
  const solarConstant = 1367 * eccentricityCorr; // W/m²

  return solarConstant * cosBeta;
}

// Liczy szacunki dla JEDNEJ godziny.
// gti: Global Tilted Irradiance z Open-Meteo (W/m²) — już z uwzględnieniem
//      Twojego kąta nachylenia, azymutu i prognozowanego zachmurzenia.
// maxTiltedTOA: teoretyczne promieniowanie na NASZ panel przy czystym niebie,
//      policzone samodzielnie funkcją maxTiltedIrradiance() - patrz wyżej.
function computeHourEstimate(gti, maxTiltedTOA, kwp) {
  const gtiClamped = Math.max(0, gti); // GTI potrafi sporadycznie wyjść lekko ujemne - to znany drobny błąd API

  const kwh = kwp * (gtiClamped / 1000) * PERFORMANCE_RATIO;
  const referenceKwh = kwp * (maxTiltedTOA * ATMOSPHERIC_CLEAR_SKY_FACTOR / 1000) * PERFORMANCE_RATIO;

  const percent = referenceKwh > 0 ? Math.min(100, (kwh / referenceKwh) * 100) : 0;

  return { kwh, referenceKwh, percent };
}

// Liczy podsumowanie CAŁEGO DNIA na podstawie godzinowych danych.
// hourlyData: tablica {hour, gti, maxTiltedTOA} - maxTiltedTOA policzone
// wcześniej naszą własną astronomią (patrz maxTiltedIrradiance()).
function computeDayEstimate(hourlyData, kwp) {
  let totalKwh = 0;
  let totalReferenceKwh = 0;
  const hourly = [];

  for (const entry of hourlyData) {
    const { kwh, referenceKwh, percent } = computeHourEstimate(entry.gti, entry.maxTiltedTOA, kwp);
    totalKwh += kwh;
    totalReferenceKwh += referenceKwh;
    hourly.push({ hour: entry.hour, kwh, referenceKwh, percent });
  }

  const dayPercent = totalReferenceKwh > 0 ? Math.min(100, (totalKwh / totalReferenceKwh) * 100) : null;
  return { totalKwh, dayPercent, hourly };
}

/* =========================================================================
   OBSŁUGA USTAWIEŃ (localStorage)
   ========================================================================= */

const SETTINGS_KEY = "fvSettings";

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveSettings(settings) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function parseCoords(text) {
  const parts = text.split(",").map(s => parseFloat(s.trim()));
  if (parts.length !== 2 || parts.some(isNaN)) return null;
  return { lat: parts[0], lon: parts[1] };
}

/* =========================================================================
   POBIERANIE PROGNOZY Z OPEN-METEO I PRZETWARZANIE
   ========================================================================= */

function pad2(n) { return n.toString().padStart(2, "0"); }

function localDateString(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

async function fetchForecast(lat, lon, tilt, azimuth) {
  // terrestrial_radiation już nie jest potrzebne - punkt odniesienia liczymy
  // teraz sami (patrz maxTiltedIrradiance). utc_offset_seconds Open-Meteo
  // zwraca zawsze przy timezone=auto, bez dopisywania go do "hourly".
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&hourly=global_tilted_irradiance` +
              `&tilt=${tilt}&azimuth=${azimuth}&forecast_days=3&timezone=auto`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Open-Meteo odpowiedziało błędem: ${response.status}`);
  return response.json();
}

// Buduje mapę: "YYYY-MM-DD" -> { godzina -> gti }, dla WSZYSTKICH godzin
// (bez filtrowania dnia/nocy) — okno godzin wyznaczamy osobno,
// funkcją computeWindowHours().
function buildDataByDate(hourlyResponse) {
  const byDate = {};
  const times = hourlyResponse.time;
  for (let i = 0; i < times.length; i++) {
    const dateStr = times[i].slice(0, 10);
    const hour = parseInt(times[i].slice(11, 13), 10);
    if (!byDate[dateStr]) byDate[dateStr] = {};
    byDate[dateStr][hour] = hourlyResponse.global_tilted_irradiance[i];
  }
  return byDate;
}

// Okno 7 kolejnych godzin, w których panele realnie widzą słońce, wyliczone
// z samego azymutu instalacji — bez ręcznego wpisywania godzin.
// Godzina centralna (środek 7-godzinnego okna) przesuwa się w stronę poranka
// dla paneli zwróconych na wschód (azymut ujemny) i w stronę popołudnia
// dla zwróconych na zachód (azymut dodatni), o 1 godzinę na każde 30°
// odchylenia od południa.
// UWAGA: ten wzór zakłada panele o realnym nachyleniu (nie poziome) —
// dla paneli leżących płasko okno powinno prawdopodobnie objąć cały dzień;
// to świadomie zostawione do kolejnej iteracji.
function computeWindowHours(azimuth) {
  const centralHourStart = 12 + Math.floor(azimuth / 30);
  const hours = [];
  // Od -3 do +4 (a nie do +3): dane GTI z Open-Meteo to "preceding hour mean",
  // więc wartość podpisana godziną H to średnia z przedziału (H-1, H].
  // Żeby pokryć pełne 7 przedziałów godzinowych wokół centrum, potrzeba
  // 8 takich wartości - stąd asymetryczny zakres pętli.
  for (let h = centralHourStart - 3; h <= centralHourStart + 4; h++) {
    hours.push(h);
  }
  return hours; // zawsze 8 godzin, w kolejności rosnącej
}

function formatKwh(kwh) { return kwh.toFixed(1).replace(".", ","); }

function tierClass(percent) {
  return percent >= 66 ? "good" : percent >= 33 ? "mid" : "low";
}

// Rysuje prosty wykres liniowy (bez żadnej biblioteki) porównujący
// moc maksymalną (przy naszym uproszczonym "bezchmurnym" odniesieniu)
// z prognozowaną mocą rzeczywistą, godzina po godzinie, w kW.
// hourly: tablica {hour, kwh, referenceKwh} - jak zwraca computeDayEstimate.
function buildDayChartSvg(hourly) {
  const width = 360, height = 130;
  const padLeft = 32, padRight = 14, padTop = 8, padBottom = 20;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;

  // Skala Y dobrana do WYŻSZEJ z obu linii w każdej godzinie - "maksimum"
  // zwykle jest wyższe, ale ATMOSPHERIC_CLEAR_SKY_FACTOR to jedna płaska
  // stała dla każdego kąta słońca, więc czasem (blisko południa, dobra
  // pogoda) prognoza może je lekko przebić. Licząc skalę z obu serii,
  // żadna z linii nigdy nie "ucieka" poza widoczny obszar wykresu.
  const maxVal = Math.max(...hourly.map(h => Math.max(h.referenceKwh, h.kwh)), 0.1);
  const niceMax = Math.ceil(maxVal * 1.1 * 10) / 10;

  const n = hourly.length;

  // Jeden punkt danych = jedna etykieta, równo rozłożone na całej szerokości.
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const xAt = i => padLeft + i * xStep;
  const yAt = v => padTop + plotH - (Math.max(0, v) / niceMax) * plotH;

  const pointsFor = key => hourly.map((h, i) => `${xAt(i).toFixed(1)},${yAt(h[key]).toFixed(1)}`).join(" ");

  const gridValues = [0, niceMax / 2, niceMax];
  const gridLines = gridValues.map(v => {
    const y = yAt(v).toFixed(1);
    return `<line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="#E4DFD3" stroke-width="1"/>` +
           `<text x="${padLeft - 4}" y="${Number(y) + 3}" font-size="9" fill="#6B6558" text-anchor="end">${v.toFixed(1)}</text>`;
  }).join("");

  // Podpisy godzin NIE siedzą dokładnie pod punktami danych - są przesunięte
  // o pół kroku w prawo względem nich (i jest ich o jeden mniej niż punktów).
  // Powód: każda wartość to "preceding hour mean" (np. "10" = średnia 9-10),
  // więc podpis "10" opisuje właściwie to, co dzieje się MIĘDZY punktem
  // reprezentującym godzinę 10 a punktem reprezentującym godzinę 11 - stąd
  // przesunięcie. Same punkty/linie zostają dokładnie tam, gdzie były.
  const hourLabelsStr = hourly.slice(0, n - 1).map((h, i) => {
    const labelX = xAt(i) + xStep / 2;
    return `<text x="${labelX.toFixed(1)}" y="${height - 6}" font-size="9" fill="#6B6558" text-anchor="middle">${h.hour}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" preserveAspectRatio="xMidYMid meet">` +
    gridLines +
    `<polyline points="${pointsFor("referenceKwh")}" fill="none" stroke="#57687A" stroke-width="2" stroke-dasharray="4 3"/>` +
    `<polyline points="${pointsFor("kwh")}" fill="none" stroke="#B5760A" stroke-width="2.5"/>` +
    hourLabelsStr +
    `</svg>`;
}

async function runForecast() {
  const settings = loadSettings();
  const statusEl = document.getElementById("status");

  if (!settings) {
    statusEl.textContent = "Uzupełnij ustawienia (współrzędne, kąt, azymut, moc instalacji).";
    statusEl.className = "status";
    document.getElementById("settings").classList.add("open");
    return;
  }

  statusEl.textContent = "Pobieranie prognozy...";
  statusEl.className = "status";

  try {
    const data = await fetchForecast(settings.lat, settings.lon, settings.tilt, settings.azimuth);
    const byDate = buildDataByDate(data.hourly);
    const windowHours = computeWindowHours(settings.azimuth);
    const utcOffsetHours = data.utc_offset_seconds / 3600;

    const today = new Date();
    const dayLabels = ["val-0", "val-1", "val-2"];
    const pctIds = ["pct-0", "pct-1", "pct-2"];
    const hourContainerIds = ["chart-0", "chart-1", "chart-2"];

    for (let dayOffset = 0; dayOffset < 3; dayOffset++) {
      const targetDate = new Date(today);
      targetDate.setDate(today.getDate() + dayOffset);
      const dateStr = localDateString(targetDate);
      const doy = dayOfYear(targetDate.getFullYear(), targetDate.getMonth() + 1, targetDate.getDate());

      const dayData = byDate[dateStr] || {};
      const el = document.getElementById(dayLabels[dayOffset]);
      const hoursEl = document.getElementById(hourContainerIds[dayOffset]);

      if (Object.keys(dayData).length === 0) {
        el.textContent = "brak danych";
        el.className = "day-value";
        document.getElementById(pctIds[dayOffset]).textContent = "";
        hoursEl.innerHTML = "";
        continue;
      }

      // Dla każdej godziny w wyliczonym oknie: GTI bierzemy z API (0, jeśli
      // jakaś godzina wypadłaby poza zwróconym zakresem - nie powinno się
      // zdarzyć przy forecast_days=3), a punkt odniesienia (maxTiltedTOA)
      // liczymy sami dla środka przedziału (H-0.5), bo GTI to "preceding
      // hour mean" - patrz komentarz przy computeWindowHours.
      const hoursForDay = windowHours.map(h => ({
        hour: h,
        gti: dayData[h] !== undefined ? dayData[h] : 0,
        maxTiltedTOA: maxTiltedIrradiance(
          doy, settings.lat, settings.lon, utcOffsetHours,
          h - 0.5, settings.tilt, settings.azimuth
        )
      }));

      const { totalKwh, dayPercent, hourly } = computeDayEstimate(hoursForDay, settings.kwp);
      const pctEl = document.getElementById(pctIds[dayOffset]);

      el.textContent = `${formatKwh(totalKwh)} kWh`;
      el.className = "day-value value-" + tierClass(dayPercent);

      pctEl.textContent = `${Math.round(dayPercent)}%`;
      pctEl.className = "day-pct value-" + tierClass(dayPercent);

      hoursEl.innerHTML = buildDayChartSvg(hourly);
    }

    statusEl.textContent = `Zaktualizowano: ${new Date().toLocaleTimeString("pl-PL")}`;
  } catch (e) {
    statusEl.textContent = "Nie udało się pobrać prognozy: " + e.message;
    statusEl.className = "status error";
  }
}

/* =========================================================================
   OBSŁUGA INTERFEJSU
   ========================================================================= */

document.getElementById("toggleSettings").addEventListener("click", () => {
  document.getElementById("settings").classList.toggle("open");
});

// Spinner azymutu - przyciski +/- zmieniają wartość o krok, więc nie trzeba
// wpisywać znaku minus z klawiatury (niektóre klawiatury numeryczne na
// Androidzie, np. domyślna Samsunga, go nie pokazują).
function stepNumberInput(inputEl, delta) {
  const min = parseFloat(inputEl.min);
  const max = parseFloat(inputEl.max);
  const current = parseFloat(inputEl.value) || 0;
  const next = Math.max(min, Math.min(max, current + delta));
  inputEl.value = next;
}

document.getElementById("azimuthDown").addEventListener("click", () => {
  stepNumberInput(document.getElementById("azimuth"), -5);
});
document.getElementById("azimuthUp").addEventListener("click", () => {
  stepNumberInput(document.getElementById("azimuth"), 5);
});

document.getElementById("refreshBtn").addEventListener("click", runForecast);

document.getElementById("saveSettings").addEventListener("click", () => {
  const coordsText = document.getElementById("coords").value;
  const coords = parseCoords(coordsText);
  const statusEl = document.getElementById("status");

  if (!coords) {
    statusEl.textContent = "Nie rozpoznaję współrzędnych — wklej w formacie: 52.1094, 19.4180";
    statusEl.className = "status error";
    return;
  }

  const tilt = parseFloat(document.getElementById("tilt").value);
  const azimuth = parseFloat(document.getElementById("azimuth").value);
  const kwp = parseFloat(document.getElementById("kwp").value);

  saveSettings({ lat: coords.lat, lon: coords.lon, tilt, azimuth, kwp });
  document.getElementById("settings").classList.remove("open");
  runForecast();
});

(function init() {
  const settings = loadSettings();
  if (settings) {
    document.getElementById("coords").value = `${settings.lat}, ${settings.lon}`;
    document.getElementById("tilt").value = settings.tilt;
    document.getElementById("azimuth").value = settings.azimuth;
    document.getElementById("kwp").value = settings.kwp;
  }
  runForecast();
})();
</script>

</body>
