<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prognoza FV</title>
<style>
  :root {
    --bg: #FAF7F2;
    --text: #22201C;
    --muted: #6B6558;
    --accent: #B5760A;
    --accent-soft: #E9CE9A;
    --slate: #57687A;
    --divider: #E4DFD3;
    --danger: #A6432E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .icon-btn {
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--muted);
    padding: 4px 8px;
  }

  .day-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 0;
    border-bottom: 1px solid var(--divider);
  }

  .day-row:first-of-type { border-top: 1px solid var(--divider); }

  .day-label {
    font-size: 0.95rem;
    color: var(--muted);
  }

  .day-value {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    font-size: 2rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .value-good { color: var(--accent); }
  .value-mid { color: var(--slate); }
  .value-low { color: var(--danger); }

  .status {
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .status.error { color: var(--danger); }

  #settings {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--divider);
    display: none;
  }

  #settings.open { display: block; }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 14px 0 4px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--divider);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }

  .hour-row {
    display: flex;
    gap: 12px;
  }

  .hour-row > div { flex: 1; }

  button.primary {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .refresh-link {
    display: inline-block;
    margin-top: 24px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Prognoza FV</h1>
    <button class="icon-btn" id="toggleSettings" aria-label="Ustawienia">⚙</button>
  </header>

  <div id="results">
    <div class="day-row"><span class="day-label">Dziś</span><span class="day-value" id="val-0">–</span></div>
    <div class="day-row"><span class="day-label">Jutro</span><span class="day-value" id="val-1">–</span></div>
    <div class="day-row"><span class="day-label">Pojutrze</span><span class="day-value" id="val-2">–</span></div>
  </div>

  <div class="status" id="status"></div>
  <button class="refresh-link" id="refreshBtn">Odśwież prognozę</button>

  <div id="settings">
    <label for="coords">Współrzędne paneli (lat, lon — wklej z Google Maps)</label>
    <input type="text" id="coords" placeholder="np. 52.1094, 19.4180">

    <div class="hour-row">
      <div>
        <label for="sunStart">Słońce od (godz.)</label>
        <input type="number" id="sunStart" min="0" max="23" value="9">
      </div>
      <div>
        <label for="sunEnd">Słońce do (godz.)</label>
        <input type="number" id="sunEnd" min="1" max="24" value="14">
      </div>
    </div>

    <button class="primary" id="saveSettings">Zapisz i pobierz prognozę</button>
  </div>
</div>

<script>
/* =========================================================================
   WZÓR SZACOWANIA PRODUKCJI — WERSJA 1 (celowo bardzo uproszczona)
   -------------------------------------------------------------------------
   To jest prowizoryczny model, do rozbudowy w kolejnych wersjach o:
   - rzeczywisty kąt padania słońca (trygonometria, pora roku)
   - kąt nachylenia paneli i ich azymut
   Wszystkie stałe poniżej są CELOWO zahardkodowane pod obecne, bardzo
   uproszczone założenia — nie wyciągaj ich do configu, dopóki model
   się nie rozwinie, żeby nie komplikować kodu na zapas.
   ========================================================================= */

// Wagi kolejnych godzin w oknie nasłonecznienia, reprezentujące ich udział
// w maksymalnej możliwej produkcji dnia (godziny bliżej południa produkują
// więcej niż godziny brzegowe, bo słońce stoi wyżej).
// UWAGA: ta tablica ma 5 elementów i zakłada okno nasłonecznienia
// o długości DOKŁADNIE 5 godzin (obecnie: 9:00-14:00). Jeśli kiedyś
// zmienisz okno na inną długość, ta tablica przestanie pasować 1:1
// do liczby godzin — patrz getHourWeights() poniżej.
const HOUR_WEIGHTS_5H = [0.5, 0.75, 1, 0.75, 0.5];

// Wpływ pełnego (100%) zachmurzenia na danym poziomie na produkcję.
// Przy 0% zachmurzenia na danym poziomie mnożnik = 1 (brak wpływu).
// Między 0% a 100% przyjmujemy zależność liniową.
const CLOUD_FLOOR_MULTIPLIER = {
  low: 0,      // pełne niskie zachmurzenie -> produkcja spada do zera
  mid: 1 / 3,  // pełne średnie zachmurzenie -> produkcja spada do 1/3
  high: 1 / 2  // pełne wysokie (pierzaste) zachmurzenie -> produkcja spada do 1/2
};

// Zwraca tablicę wag dla okna nasłonecznienia o zadanej długości.
// Dla dokładnie 5 godzin używamy dopracowanej tablicy HOUR_WEIGHTS_5H.
// Dla każdej innej długości okna na razie używamy naiwnego fallbacku
// (wszystkie godziny równe) — do poprawienia, gdy model się rozwinie.
function getHourWeights(hoursCount) {
  if (hoursCount === HOUR_WEIGHTS_5H.length) {
    return HOUR_WEIGHTS_5H;
  }
  console.warn(`Okno nasłonecznienia ma ${hoursCount} godzin, a wzór wag jest dopracowany tylko dla 5. Używam tymczasowo równych wag.`);
  return new Array(hoursCount).fill(1);
}

// Liczy mnożnik produkcji (0..1) dla JEDNEJ godziny na podstawie zachmurzenia
// na trzech poziomach (w procentach 0-100, tak jak zwraca je Open-Meteo).
// Każdy poziom chmur traktujemy jako NIEZALEŻNĄ warstwę atmosfery —
// efekty się mnożą (światło przechodzi przez kolejne warstwy).
function cloudMultiplierForHour(lowPct, midPct, highPct) {
  const lowFrac = lowPct / 100;
  const midFrac = midPct / 100;
  const highFrac = highPct / 100;

  const lowFactor  = 1 - lowFrac  * (1 - CLOUD_FLOOR_MULTIPLIER.low);
  const midFactor  = 1 - midFrac  * (1 - CLOUD_FLOOR_MULTIPLIER.mid);
  const highFactor = 1 - highFrac * (1 - CLOUD_FLOOR_MULTIPLIER.high);

  return lowFactor * midFactor * highFactor;
}

// Liczy produkcję CAŁEGO DNIA jako procent maksymalnej możliwej produkcji
// (czyli produkcji przy całkowicie bezchmurnym niebie przez całe okno).
// hourlyCloudData: tablica obiektów {low, mid, high} — po jednym na każdą
// godzinę okna nasłonecznienia, w kolejności rosnącej.
function calculateDayProductionPercent(hourlyCloudData) {
  const weights = getHourWeights(hourlyCloudData.length);

  let weightedSum = 0;
  let maxPossibleSum = 0;

  for (let i = 0; i < weights.length; i++) {
    const weight = weights[i];
    maxPossibleSum += weight;

    const hourData = hourlyCloudData[i];
    if (!hourData) continue; // brak danych dla tej godziny - liczymy jako 0

    const multiplier = cloudMultiplierForHour(hourData.low, hourData.mid, hourData.high);
    weightedSum += weight * multiplier;
  }

  if (maxPossibleSum === 0) return null;
  return (weightedSum / maxPossibleSum) * 100;
}

/* =========================================================================
   OBSŁUGA USTAWIEŃ (localStorage)
   ========================================================================= */

const SETTINGS_KEY = "fvSettings";

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveSettings(settings) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function parseCoords(text) {
  const parts = text.split(",").map(s => parseFloat(s.trim()));
  if (parts.length !== 2 || parts.some(isNaN)) return null;
  return { lat: parts[0], lon: parts[1] };
}

/* =========================================================================
   POBIERANIE PROGNOZY Z OPEN-METEO I PRZETWARZANIE
   ========================================================================= */

function pad2(n) { return n.toString().padStart(2, "0"); }

// Zwraca datę w formacie YYYY-MM-DD w CZASIE LOKALNYM urządzenia
// (zakładamy, że telefon jest w tej samej strefie czasowej co panele —
// rozsądne założenie dla osobistej aplikacji).
function localDateString(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function generateSunHours(start, end) {
  const hours = [];
  for (let h = start; h < end; h++) hours.push(h);
  return hours;
}

async function fetchForecast(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&hourly=cloudcover_low,cloudcover_mid,cloudcover_high&forecast_days=3&timezone=auto`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Open-Meteo odpowiedziało błędem: ${response.status}`);
  return response.json();
}

// Buduje mapę: "YYYY-MM-DD" -> { godzina -> {low, mid, high} }
function buildCloudDataByDate(hourlyResponse) {
  const byDate = {};
  const times = hourlyResponse.time;
  for (let i = 0; i < times.length; i++) {
    const dateStr = times[i].slice(0, 10);
    const hour = parseInt(times[i].slice(11, 13), 10);
    if (!byDate[dateStr]) byDate[dateStr] = {};
    byDate[dateStr][hour] = {
      low: hourlyResponse.cloudcover_low[i],
      mid: hourlyResponse.cloudcover_mid[i],
      high: hourlyResponse.cloudcover_high[i]
    };
  }
  return byDate;
}

async function runForecast() {
  const settings = loadSettings();
  const statusEl = document.getElementById("status");

  if (!settings) {
    statusEl.textContent = "Uzupełnij ustawienia (współrzędne i godziny), żeby zobaczyć prognozę.";
    statusEl.className = "status";
    document.getElementById("settings").classList.add("open");
    return;
  }

  statusEl.textContent = "Pobieranie prognozy...";
  statusEl.className = "status";

  try {
    const data = await fetchForecast(settings.lat, settings.lon);
    const byDate = buildCloudDataByDate(data.hourly);
    const sunHours = generateSunHours(settings.sunStart, settings.sunEnd);

    const today = new Date();
    const dayLabels = ["val-0", "val-1", "val-2"];

    for (let dayOffset = 0; dayOffset < 3; dayOffset++) {
      const targetDate = new Date(today);
      targetDate.setDate(today.getDate() + dayOffset);
      const dateStr = localDateString(targetDate);

      const dayData = byDate[dateStr] || {};
      const hourlyCloudData = sunHours.map(h => dayData[h]);

      const percent = calculateDayProductionPercent(hourlyCloudData);
      const el = document.getElementById(dayLabels[dayOffset]);

      if (percent === null) {
        el.textContent = "brak danych";
        el.className = "day-value";
      } else {
        el.textContent = `${Math.round(percent)}%`;
        el.className = "day-value " +
          (percent >= 66 ? "value-good" : percent >= 33 ? "value-mid" : "value-low");
      }
    }

    statusEl.textContent = `Zaktualizowano: ${new Date().toLocaleTimeString("pl-PL")}`;
  } catch (e) {
    statusEl.textContent = "Nie udało się pobrać prognozy: " + e.message;
    statusEl.className = "status error";
  }
}

/* =========================================================================
   OBSŁUGA INTERFEJSU
   ========================================================================= */

document.getElementById("toggleSettings").addEventListener("click", () => {
  document.getElementById("settings").classList.toggle("open");
});

document.getElementById("refreshBtn").addEventListener("click", runForecast);

document.getElementById("saveSettings").addEventListener("click", () => {
  const coordsText = document.getElementById("coords").value;
  const coords = parseCoords(coordsText);
  const statusEl = document.getElementById("status");

  if (!coords) {
    statusEl.textContent = "Nie rozpoznaję współrzędnych — wklej w formacie: 52.1094, 19.4180";
    statusEl.className = "status error";
    return;
  }

  const sunStart = parseInt(document.getElementById("sunStart").value, 10);
  const sunEnd = parseInt(document.getElementById("sunEnd").value, 10);

  saveSettings({ lat: coords.lat, lon: coords.lon, sunStart, sunEnd });
  document.getElementById("settings").classList.remove("open");
  runForecast();
});

// Przy starcie: wczytaj zapisane ustawienia do formularza (jeśli są) i pobierz prognozę.
(function init() {
  const settings = loadSettings();
  if (settings) {
    document.getElementById("coords").value = `${settings.lat}, ${settings.lon}`;
    document.getElementById("sunStart").value = settings.sunStart;
    document.getElementById("sunEnd").value = settings.sunEnd;
  }
  runForecast();
})();
</script>

</body>
</html>
